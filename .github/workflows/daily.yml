name: Make Shorts video
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fix for: FileNotFoundError: 'ffprobe' (ffprobe ships with ffmpeg)
      - name: Install ffmpeg (includes ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - run: pip install requests gTTS Pillow

      - name: Generate script
        run: python generate_script.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Download stock footage (optional, needs PEXELS_API_KEY secret)
        run: python fetch_footage.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Make video
        run: python make_video.py

      - name: Check video file
        run: |
          test -s video.mp4
          dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 video.mp4)
          echo "video.mp4 duration: ${dur}s"
          python -c "import sys; d=float('$dur'); sys.exit(0 if 20 <= d <= 75 else 1)"

      - uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: |
            video.mp4
            script.json
            credits.txt
          if-no-files-found: error
